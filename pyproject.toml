[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audiolab-editor"
version = "1.2.1"
description = "AudioLab Editor — Capture, edite e separe áudio e vídeo com IA"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Rubens Lyra", email = "rubens.lyra@outlook.com" },
]
keywords = ["audio", "video", "demucs", "stems", "editor", "youtube-dl", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Editors",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "customtkinter==5.2.2",
  "pillow>=11",
  "yt-dlp>=2025.1",
]

[project.urls]
Homepage = "https://github.com/rubenslyra/AudioLabEditor"
Repository = "https://github.com/rubenslyra/AudioLabEditor"
Issues = "https://github.com/rubenslyra/AudioLabEditor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-timeout>=2",
    "ruff>=0.11",
]
ai = [
  "torch>=2.0",
  "torchaudio>=2.0",
  "dora-search>=0.4",
  "julius>=0.3",
  "einops>=0.8",
  "PyYAML>=6.0",
  "omegaconf>=2.3",
  "numpy>=1.26",
  "tqdm>=4.66",
  "lameenc>=1.7",
  "openunmix>=1.3",
  "faster-whisper>=1.1.0",
  "edge-tts>=7.2.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
