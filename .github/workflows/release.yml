name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: AudioLabEditor
            asset_name: audiolab-editor-linux-x86_64
          - os: windows-latest
            binary_name: AudioLabEditor.exe
            asset_name: audiolab-editor-windows-x86_64.exe
          - os: macos-latest
            binary_name: AudioLabEditor
            asset_name: audiolab-editor-macos-x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg

      - name: Install dependencies
        run: |
          pip install -e ".[dev,ai]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller scripts/AudioLabEditor.spec --log-level WARN

      - name: Verify binary exists (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ls -lh dist/${{ matrix.binary_name }}
          file dist/${{ matrix.binary_name }}

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        run: |
          dir dist\${{ matrix.binary_name }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect artifacts
        run: |
          find artifacts -type f -ls

      - name: Create Release with gh CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          BODY=".github/RELEASE_TEMPLATE.md"

          echo "Creating release for tag: $TAG"

          # Flatten artifacts: copy each binary to a flat dir with its asset name
          # artifacts/<asset_name>/<binary_file> -> artifacts-out/<asset_name>
          mkdir -p artifacts-out
          release_files=()
          for dir in artifacts/*/; do
            asset="$(basename "$dir")"
            binary=$(find "$dir" -type f | head -1)
            if [ -z "$binary" ]; then
              echo "WARNING: No binary found in $dir, skipping"
              continue
            fi
            cp "$binary" "artifacts-out/$asset"
            release_files+=("artifacts-out/$asset")
            echo "  Prepared: artifacts-out/$asset"
          done

          if [ ${#release_files[@]} -eq 0 ]; then
            echo "ERROR: No artifact files found!"
            exit 1
          fi

          echo "Uploading ${#release_files[@]} artifact(s):"
          printf '  %s\n' "${release_files[@]}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$BODY" \
            --generate-notes \
            "${release_files[@]}"

          echo "Release created successfully!"
